name: Scheduled Browser and Link Checks

on:
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    env:
      ASSET_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build site
        run: npm run clean && npm run build

      - name: Run cross-browser regression suite
        run: npm run test:e2e:cross-browser

  external-links:
    runs-on: ubuntu-latest
    env:
      ASSET_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run clean && npm run build

      - name: Check generated local and external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-retries 2
            --timeout 30
            --accept '100..=103,200..=399,429'
            --exclude 'https://help\.openai\.com/.*'
            --exclude 'https://openai\.com/.*'
            --exclude 'https://chatgpt\.com/.*'
            --exclude 'https://(www\.)?reddit\.com/.*'
            --exclude 'https://(www\.)?zhihu\.com/.*'
            --exclude 'https://zhuanlan\.zhihu\.com/.*'
            --exclude 'https://www\.wsj\.com/.*'
            --exclude 'https://[^/]*\.feishu\.cn/.*'
            --exclude 'https://www\.espressif\.com\.cn/.*'
            --root-dir public
            'public/**/*.html'
          token: ${{ secrets.GITHUB_TOKEN }}
