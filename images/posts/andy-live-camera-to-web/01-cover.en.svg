<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A Photo Travels from D5600 to the Web</title>
  <desc id="desc">A Nikon D5600 sends a photo through SnapBridge to an Android phone, FolderSync uploads it to private Cloudflare R2, and Andy Live displays it on the web.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243b5b"/><stop offset="1" stop-color="#12253e"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#27405e" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#6f90c4"/></marker>
    <style>
      .title{font:700 52px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1c2d45}
      .sub{font:400 24px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#61738b}
      .name{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#21334c}
      .detail{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#66788f}
      .step{font:700 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#6382aa;letter-spacing:2px}
      .footer{font:500 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#d6e3f5}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <path d="M0 730C350 660 490 815 800 745s475-125 800-20v175H0Z" fill="#dfe9f7" opacity=".7"/>
  <text x="95" y="117" class="title">One Photo, Four Handoffs</text>
  <text x="96" y="162" class="sub">From shutter press to a photo on the live page</text>

  <path d="M390 445H458M740 445h68M1090 445h68" stroke="#82a0ca" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="94" y="279" width="296" height="335" rx="26" fill="#fff" stroke="#d6e0ee" stroke-width="2"/>
    <rect x="458" y="279" width="282" height="335" rx="26" fill="#fff" stroke="#d6e0ee" stroke-width="2"/>
    <rect x="808" y="279" width="282" height="335" rx="26" fill="#fff" stroke="#d6e0ee" stroke-width="2"/>
    <rect x="1158" y="279" width="348" height="335" rx="26" fill="#fff" stroke="#d6e0ee" stroke-width="2"/>
  </g>

  <text x="124" y="329" class="step">01 / CAPTURE</text>
  <rect x="177" y="377" width="130" height="91" rx="13" fill="#dce8f9" stroke="#6286b5" stroke-width="5"/>
  <path d="M193 376l23-25h51l22 25M205 467h74" fill="#dce8f9" stroke="#6286b5" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="242" cy="422" r="31" fill="#fff" stroke="#6286b5" stroke-width="6"/>
  <circle cx="242" cy="422" r="13" fill="#9db8db"/>
  <text x="124" y="537" class="name">D5600</text><text x="124" y="572" class="detail">Shutter press</text>

  <text x="488" y="329" class="step">02 / TRANSFER</text>
  <rect x="555" y="365" width="88" height="127" rx="16" fill="#e7f0fb" stroke="#6488b8" stroke-width="5"/>
  <rect x="570" y="384" width="58" height="78" rx="5" fill="#b6cbed"/>
  <circle cx="599" cy="477" r="5" fill="#6488b8"/>
  <text x="488" y="537" class="name">Android phone</text><text x="488" y="572" class="detail">SnapBridge + FolderSync</text>

  <text x="838" y="329" class="step">03 / STORAGE</text>
  <path d="M889 450c-16 0-30-13-30-29s13-30 30-30c9-26 36-42 63-34 18-23 56-18 68 10 22-4 45 13 45 37 0 25-18 46-44 46Z" fill="#dfebfb" stroke="#6488b8" stroke-width="5"/>
  <path d="M929 430h65M929 443h47" stroke="#8aa9d1" stroke-width="5" stroke-linecap="round"/>
  <text x="838" y="537" class="name">Private R2</text><text x="838" y="572" class="detail">Store previews</text>

  <text x="1188" y="329" class="step">04 / DISPLAY</text>
  <rect x="1251" y="376" width="160" height="103" rx="9" fill="#e4eefb" stroke="#6488b8" stroke-width="5"/>
  <path d="M1268 400h126M1280 427h48m16 0h48m-111 21h111" stroke="#a5bfdf" stroke-width="7" stroke-linecap="round"/>
  <path d="M1236 489h190" stroke="#6488b8" stroke-width="6" stroke-linecap="round"/>
  <text x="1188" y="537" class="name">Andy Live page</text><text x="1188" y="572" class="detail">Grouped by time</text>

  <rect x="95" y="690" width="1410" height="116" rx="22" fill="url(#dark)"/>
  <text x="145" y="740" class="footer">First: can a photo reliably reach the website?</text>
  <text x="145" y="775" class="footer">Review, QR codes, and payment came after the pipeline worked.</text>
</svg>
