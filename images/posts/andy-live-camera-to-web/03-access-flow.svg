<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Andy Live 照片审核与下载权限</title>
  <desc id="desc">手机上传至私有 R2 后先待审核。摄影师批准后生成带水印浏览图和独立的 2MP 交付图，浏览图可出现在公开页或指定客户二维码页；付款成功后才开放该张交付图的下载。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#263b63" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#7897c2"/></marker>
    <style>
      .title{font:700 46px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#20324a}
      .sub{font:400 21px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#687b94}
      .label{font:700 27px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#243752}
      .small{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#647892}
      .badge{font:700 17px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#fff}
      .tiny{font:500 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526a8d}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <text x="80" y="95" class="title">同一张照片，三种权限</text>
  <text x="82" y="133" class="sub">手机上传不等于公开；看到浏览图也不等于拿到交付文件。</text>

  <path d="M346 290h96M775 290h110" stroke="#7897c2" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1040 376v95M1040 572v88" stroke="#7897c2" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M772 372v285" stroke="#7897c2" stroke-width="5" stroke-dasharray="12 12"/>
  <path d="M772 656h112" stroke="#7897c2" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="198" width="266" height="186" rx="24" fill="#fff" stroke="#d7e2f0" stroke-width="2"/>
    <rect x="442" y="198" width="333" height="186" rx="24" fill="#fff" stroke="#d7e2f0" stroke-width="2"/>
    <rect x="885" y="198" width="620" height="186" rx="24" fill="#fff" stroke="#d7e2f0" stroke-width="2"/>
    <rect x="885" y="471" width="620" height="101" rx="22" fill="#e5eefb" stroke="#cad9ec" stroke-width="2"/>
    <rect x="885" y="660" width="620" height="119" rx="22" fill="#fff7ea" stroke="#ebd8b7" stroke-width="2"/>
  </g>

  <rect x="105" y="224" width="88" height="27" rx="13" fill="#6f92c0"/><text x="118" y="244" class="badge">上传</text>
  <text x="106" y="302" class="label">私有 R2</text>
  <text x="106" y="338" class="small">incoming/ 或旧 previews/</text>

  <rect x="468" y="224" width="88" height="27" rx="13" fill="#6f92c0"/><text x="481" y="244" class="badge">待审</text>
  <text x="468" y="302" class="label">摄影师后台</text>
  <text x="468" y="338" class="small">选图、准备、公开或删除</text>

  <rect x="912" y="224" width="139" height="27" rx="13" fill="#628abf"/><text x="925" y="244" class="badge">带水印浏览图</text>
  <text x="912" y="302" class="label">display/</text>
  <text x="912" y="338" class="small">可进入现场页，或只放进客户二维码</text>

  <text x="915" y="531" class="label">客户查看专属页面</text>
  <text x="1294" y="530" class="tiny">只能浏览</text>

  <rect x="912" y="683" width="114" height="27" rx="13" fill="#c58f43"/><text x="925" y="703" class="badge">付款验证</text>
  <text x="912" y="748" class="label">delivery/ · 2MP 交付图</text>
  <text x="1246" y="748" class="tiny">逐张下载</text>

  <text x="81" y="848" class="small">Stripe 回调核对具体订单后才授权下载；高清原图目前没有进入这条链路。</text>
</svg>
