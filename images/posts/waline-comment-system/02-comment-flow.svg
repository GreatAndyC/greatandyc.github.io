<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1050" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Waline 评论提交流程</title>
  <desc id="desc">读者填写评论和联系信息，完成 Turnstile 验证，Waline 后端接收请求并按审核状态保存到 Neon，随后通过 Zoho Mail 通知站长。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#263b63" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#6b8ac9"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2e49; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66758e; }
      .step { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b8ac9; letter-spacing: 1px; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2e49; }
      .small { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #61718b; }
      .note { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7a5b27; }
    </style>
  </defs>

  <rect width="1600" height="700" rx="30" fill="url(#bg)"/>
  <text x="70" y="82" class="title">一条评论是怎样到达站长邮箱的</text>
  <text x="70" y="118" class="subtitle">邮箱必填用于联系和通知；它本身不能证明评论者就是某个真实身份。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="215" height="205" rx="22" fill="#fff" stroke="#d6dfef" stroke-width="2"/>
    <text x="95" y="260" class="step">01 / FORM</text>
    <text x="95" y="305" class="label">填写评论</text>
    <text x="95" y="350" class="small">昵称（必填）</text>
    <text x="95" y="378" class="small">邮箱（必填）</text>
    <text x="95" y="406" class="small">网站（可选）</text>

    <rect x="345" y="220" width="215" height="205" rx="22" fill="#fffaf2" stroke="#ecdcbf" stroke-width="2"/>
    <text x="370" y="260" class="step">02 / CHECK</text>
    <text x="370" y="305" class="label">Turnstile</text>
    <text x="370" y="350" class="small">检查访问行为</text>
    <text x="370" y="378" class="small">必要时显示验证按钮</text>
    <text x="370" y="406" class="small">通过后才允许提交</text>

    <rect x="620" y="220" width="215" height="205" rx="22" fill="#f4f7ff" stroke="#d6dfef" stroke-width="2"/>
    <text x="645" y="260" class="step">03 / API</text>
    <text x="645" y="305" class="label">Waline 接收</text>
    <text x="645" y="350" class="small">校验字段和请求</text>
    <text x="645" y="378" class="small">过滤明显滥用</text>
    <text x="645" y="406" class="small">决定审核状态</text>

    <rect x="895" y="220" width="215" height="205" rx="22" fill="#fff" stroke="#d6dfef" stroke-width="2"/>
    <text x="920" y="260" class="step">04 / REVIEW</text>
    <text x="920" y="305" class="label">审核与保存</text>
    <text x="920" y="350" class="small">Neon 保存评论记录</text>
    <text x="920" y="378" class="small">开启审核时先待审</text>
    <text x="920" y="406" class="small">通过后才公开显示</text>

    <rect x="1170" y="220" width="215" height="205" rx="22" fill="#fff" stroke="#d6dfef" stroke-width="2"/>
    <text x="1195" y="260" class="step">05 / NOTICE</text>
    <text x="1195" y="305" class="label">发送通知</text>
    <text x="1195" y="350" class="small">Zoho Mail 通过 SMTP</text>
    <text x="1195" y="378" class="small">把新评论提醒站长</text>
    <text x="1195" y="406" class="small">不是给读者创建账号</text>
  </g>

  <path d="M285 322h50M560 322h50M835 322h50M1110 322h50" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="70" y="515" width="1315" height="70" rx="18" fill="#fff5df"/>
  <text x="100" y="558" class="note">隐私提示：文章中的邮箱、域名、Site Key、SMTP 密码、数据库连接串和后台截图均使用示例或脱敏版本。</text>
</svg>
