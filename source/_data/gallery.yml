  zh-CN: 画廊还没有内容，后续会逐步补充更多作品。
  en: The gallery is empty for now. More work will be added over time.
albums:
  - slug: heartbeat-pi-2026
    languages:
      - zh-CN
      - en
    title:
      zh-CN: 3.14 心跳Π对
      en: 3.14 Heartbeat Pi Night
    period:
      zh-CN: 2026 · 舞台与活动摄影
      en: 2026 · Stage and Event Photography
    location:
      zh-CN: 香港大学庄月明文化中心
      en: Chong Yuet Ming Cultural Centre, HKU
    camera:
      zh-CN: Nikon D5600 · AF-S DX NIKKOR 18-140mm
      en: Nikon D5600 · AF-S DX NIKKOR 18-140mm
    description:
      zh-CN: 这组照片来自一次校园晚会拍摄。画面里有灯光、舞台、群舞、歌手和活动摄影现场的即时反应。
      en: A selection from a campus performance night, focused on stage light, performers, crowd rhythm, and the on-the-fly decisions of event photography.
    tags:
      zh-CN:
        - 舞台
        - 演出
        - 活动摄影
      en:
        - Stage
        - Performance
        - Event Photography
    photos:
      - src: /images/gallery/heartbeat-pi-2026/3.16_封面图.jpg
        title:
          zh-CN: 封面瞬间
          en: Opening Frame
        caption:
          zh-CN: 作为整组照片的入口画面，重点是灯光和舞台氛围。
          en: A scene-setting frame that introduces the light and atmosphere of the show.
        meta: 18mm · 1/160s · f/3.5 · ISO 8000
      - src: /images/gallery/heartbeat-pi-2026/3.16_FirstView.jpg
        title:
          zh-CN: 第一视角
          en: First View
        caption:
          zh-CN: 演出开始前后的观众席与机位观察。
          en: A field note from the opening phase, showing the point of view before the pace accelerates.
        meta: 22mm · 1/125s · f/4.0 · ISO 6400
      - src: /images/gallery/heartbeat-pi-2026/3.16_Kpop.jpg
        title:
          zh-CN: 群舞定格
          en: Dance Formation
        caption:
          zh-CN: 节奏最快的一组表演里，最重要的是抓住动作统一的瞬间。
          en: In the fastest performance, the key is to catch the instant when motion lines up.
        meta: 35mm · 1/200s · f/4.5 · ISO 8000
      - src: /images/gallery/heartbeat-pi-2026/3.16_Singer1.jpg
        title:
          zh-CN: 歌手侧面
          en: Singer from the Side
        caption:
          zh-CN: 侧拍比正面更容易避开话筒遮挡。
          en: A side angle keeps the microphone from blocking the expression.
        meta: 70mm · 1/160s · f/5.0 · ISO 5000
      - src: /images/gallery/heartbeat-pi-2026/3.16_GroupPhotos.jpg
        title:
          zh-CN: 合照时刻
          en: Group Portrait
        caption:
          zh-CN: 演出结束后的集体合照，也是活动摄影的最后一个重要节点。
          en: The closing group portrait, often the final key frame of an event assignment.
        meta: 24mm · 1/100s · f/4.0 · ISO 3200
      - src: /images/gallery/heartbeat-pi-2026/3.16_LongPic.jpg
        title:
          zh-CN: 乐队全景
          en: Band Panorama
        caption:
          zh-CN: 一张偏“作品感”的横向全景，更强调氛围和空间关系。
          en: A wider panoramic frame that leans more toward a finished photographic piece.
        meta: Panorama Stitch · Multi-shot
      - src: /images/gallery/heartbeat-pi-2026/3.16_Prepare.jpg
        title:
          zh-CN: 开拍前的准备
          en: Before the Show
        caption:
          zh-CN: 正式拍摄之外，我也会保留一些工作流痕迹。
          en: Beyond the stage itself, I like keeping small traces of the workflow.
        meta: 28mm · 1/80s · f/4.0 · ISO 2500
      - src: /images/gallery/heartbeat-pi-2026/3.16_梯子.jpg
        title:
          zh-CN: 现场趣味
          en: On-site Humor
        caption:
          zh-CN: 除了正式画面，活动摄影里也常常有轻松又有记忆点的瞬间。
          en: Event work also leaves room for lighter frames that still stay memorable.
        meta: 32mm · 1/125s · f/4.2 · ISO 4000
