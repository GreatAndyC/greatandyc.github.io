<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Waline 评论系统服务架构</title>
  <desc id="desc">读者从博客提交评论，经过 Cloudflare Turnstile 验证后，由 Vercel 上的 Waline 服务写入 Neon 数据库，并通过 Zoho Mail 发送通知。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#263b63" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#6b8ac9"/>
    </marker>
    <style>
      .title { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2e49; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66758e; }
      .label { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2e49; }
      .small { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #61718b; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #71809a; }
      .box { stroke: #d6dfef; stroke-width: 2; }
      .arrow-label { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52698f; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="80" y="92" class="title">Waline 评论系统：一次请求经过哪些服务</text>
  <text x="80" y="130" class="subtitle">脱敏示意图：实际部署中的域名、账号、密钥和数据库连接信息均未出现在图中。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="328" width="270" height="190" rx="24" fill="#ffffff" class="box"/>
    <circle cx="140" cy="390" r="28" fill="#e4edff"/>
    <path d="M126 388h28M126 402h19M126 374h28" stroke="#5d80c7" stroke-width="5" stroke-linecap="round"/>
    <text x="185" y="393" class="label">读者浏览器</text>
    <text x="110" y="450" class="small">填写昵称、邮箱、评论</text>
    <text x="110" y="478" class="small">邮箱不在评论区公开展示</text>

    <rect x="470" y="328" width="300" height="190" rx="24" fill="#ffffff" class="box"/>
    <circle cx="532" cy="390" r="28" fill="#e8f3ed"/>
    <path d="M518 392l10 10 19-24" fill="none" stroke="#4c9a70" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="393" class="label">博客前端</text>
    <text x="500" y="450" class="small">静态页面加载 Waline 组件</text>
    <text x="500" y="478" class="small">示例：blog.example.com</text>

    <rect x="875" y="128" width="285" height="180" rx="24" fill="#fffaf2" class="box"/>
    <circle cx="935" cy="190" r="28" fill="#ffe8be"/>
    <path d="M935 169v23l14 10" fill="none" stroke="#d99036" stroke-width="5" stroke-linecap="round"/>
    <text x="980" y="193" class="label">Turnstile</text>
    <text x="905" y="245" class="small">Cloudflare 人机校验</text>
    <text x="905" y="272" class="small">降低机器人滥用</text>

    <rect x="875" y="500" width="330" height="200" rx="24" fill="#f4f7ff" class="box"/>
    <circle cx="940" cy="565" r="28" fill="#e0e9ff"/>
    <path d="M923 568h34M930 553h20M930 582h20" stroke="#5d80c7" stroke-width="5" stroke-linecap="round"/>
    <text x="990" y="568" class="label">Waline API</text>
    <text x="905" y="620" class="small">Vercel 托管的评论后端</text>
    <text x="905" y="648" class="small">审核、点赞、用户和通知</text>

    <rect x="1320" y="500" width="220" height="200" rx="24" fill="#ffffff" class="box"/>
    <circle cx="1380" cy="565" r="28" fill="#e6f1f4"/>
    <path d="M1362 557h36v27h-36zM1368 548h24M1368 591h24" fill="none" stroke="#4d8d9a" stroke-width="5" stroke-linecap="round"/>
    <text x="1425" y="568" class="label">Neon</text>
    <text x="1350" y="620" class="small">PostgreSQL 数据库</text>
    <text x="1350" y="648" class="small">保存评论与状态</text>

    <rect x="1320" y="128" width="220" height="180" rx="24" fill="#ffffff" class="box"/>
    <circle cx="1380" cy="190" r="28" fill="#e9e6ff"/>
    <path d="M1363 183h34v27h-34zM1363 183l17 14 17-14" fill="none" stroke="#7766b8" stroke-width="5" stroke-linejoin="round"/>
    <text x="1425" y="193" class="label">Zoho Mail</text>
    <text x="1350" y="245" class="small">SMTP 通知出口</text>
    <text x="1350" y="272" class="small">提醒站长审核评论</text>
  </g>

  <path d="M350 423h110" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="370" y="397" class="arrow-label">加载评论</text>
  <path d="M770 380 865 275" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="770" y="300" class="arrow-label">人机验证</text>
  <path d="M770 465 865 555" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="770" y="525" class="arrow-label">API 请求</text>
  <path d="M1205 600h100" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1200" y="575" class="arrow-label">评论数据</text>
  <path d="M1205 555 1305 275" fill="none" stroke="#6b8ac9" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1210" y="390" class="arrow-label">通知邮件</text>

  <rect x="80" y="785" width="1460" height="60" rx="18" fill="#edf3ff"/>
  <text x="110" y="823" class="tiny">GitHub 保存后端代码 → Vercel 自动部署 → Cloudflare 提供 DNS 与 Turnstile → Neon 保存数据 → Zoho Mail 发送通知</text>
</svg>
